# Basic Nginx reverse proxy setup for Task 05

http {
    limit_req_zone $binary_remote_addr zone=basic_limit:10m rate=5r/s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        # Simple rate limit
        limit_req zone=basic_limit burst=10 nodelay;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Basic browser caching for static files
            location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800";
                proxy_pass http://127.0.0.1:5000;
            }
        }
    }

    # HTTPS server can be added after a certificate is available.
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
}
